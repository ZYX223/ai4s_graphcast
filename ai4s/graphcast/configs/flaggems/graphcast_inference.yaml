version: 2
profile: graphcast_inference
scope: inference

# One logical inference contract is requested on every platform. Whether an
# implementation is actually dispatched is measured and reported separately;
# this file must not turn an observed platform failure into a silent default.
ops:
  - addmm
  - cat
  - native_layer_norm
  - index_add_
  - silu
  - index
  - add

# Keep only measured correctness exceptions here; do not duplicate the shared
# list per platform. On 810E, addmm alone exceeds the 40-step envelope, while
# native_layer_norm + index_add_ together also exceeds it. Retain the more
# frequently exercised LayerNorm path and keep these two interfaces Native.
exclude_ops_by_backend:
  ptg:
    - addmm
    - index_add_
