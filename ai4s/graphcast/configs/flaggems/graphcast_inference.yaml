version: 2
profile: graphcast_inference
scope: inference

# One logical inference contract is requested on every platform. Whether an
# implementation is actually dispatched is measured and reported separately;
# this file must not turn an observed platform failure into a silent default.
ops:
  - addmm
  - cat
  - native_layer_norm
  - index_add_
  - silu
  - index
  - add

# The 810E addmm path fails the model-level FP32 correctness envelope. Keep
# index_add_ enabled: the validated 6/7 production profile excludes addmm only.
exclude_ops_by_backend:
  ptg:
    - addmm
