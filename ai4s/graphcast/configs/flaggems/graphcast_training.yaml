version: 1
profile: graphcast_training
scope: forward

# This allowlist covers operators invoked by the training forward pass.
# Backward operator coverage is validated and reported separately.
default_ops:
  - silu
  - add

platform_ops:
  ascend:
    - addmm
    - silu
    - layer_norm
    - cat
    - index
    - add
  hygon:
    - addmm
    - silu
    - layer_norm
    - index
  ptg:
    - addmm
    - silu
    - layer_norm
    - index
    - add
