# Google GraphCast operational 25km inference contract.
#
# This profile is intentionally separate from google_graphcast_small.yaml. It
# uses the operational 0.25 degree checkpoint and the TASK_13_PRECIP_OUT-style
# input contract: total_precipitation_6hr is a target, but not an input.

profile: google_graphcast_operational_25km

source:
  checkpoint: data/raw/wcy_graphcast_reference/GraphCast_operational_25km.npz
  checkpoint_sha256: 8f485e84343072785522f6d0696c198c7712e9f0f14070a88c26a9ff35db75a9
  license: CC-BY-NC-SA-4.0

model_config:
  resolution: 0.25
  mesh_size: 6
  latent_size: 512
  gnn_msg_steps: 16
  hidden_layers: 1
  radius_query_fraction_edge_length: 0.5999912857713345
  mesh2grid_edge_normalization_factor: 0.6180338738074472
  grid2mesh_edge_chunk_size: 131072
  mesh2grid_edge_chunk_size: 131072
  extra_mesh2grid_final_output_heads:
    mesh_nodes: 83

task_config:
  input_duration: 12h
  pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]

  # Original checkpoint order. Unlike GraphCast_small, this operational profile
  # does not include total_precipitation_6hr in the input window.
  input_variables:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - temperature
    - geopotential
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - specific_humidity
    - toa_incident_solar_radiation
    - year_progress_sin
    - year_progress_cos
    - day_progress_sin
    - day_progress_cos
    - geopotential_at_surface
    - land_sea_mask

  target_variables:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - total_precipitation_6hr
    - temperature
    - geopotential
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - specific_humidity

  forcing_variables:
    - toa_incident_solar_radiation
    - year_progress_sin
    - year_progress_cos
    - day_progress_sin
    - day_progress_cos

  static_variables:
    - geopotential_at_surface
    - land_sea_mask

variables:
  atmospheric:
    - temperature
    - geopotential
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - specific_humidity
  surface_inputs:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
  surface_targets:
    - 2m_temperature
    - mean_sea_level_pressure
    - 10m_v_component_of_wind
    - 10m_u_component_of_wind
    - total_precipitation_6hr
  forcing:
    - toa_incident_solar_radiation
    - year_progress_sin
    - year_progress_cos
    - day_progress_sin
    - day_progress_cos
  static:
    - geopotential_at_surface
    - land_sea_mask

stacking:
  preserved_dims: [batch, lat, lon]
  data_var_order_rule: sorted_dataset_data_var_names
  input_time_steps: 2
  target_time_steps: 1
  target_time_forcing_steps: 1

  # dataset_to_stacked(inputs) order, i.e. sorted(input_variables).
  input_data_var_order:
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - 2m_temperature
    - day_progress_cos
    - day_progress_sin
    - geopotential
    - geopotential_at_surface
    - land_sea_mask
    - mean_sea_level_pressure
    - specific_humidity
    - temperature
    - toa_incident_solar_radiation
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity
    - year_progress_cos
    - year_progress_sin

  # dataset_to_stacked(forcings) order, i.e. sorted(forcing_variables).
  forcing_data_var_order:
    - day_progress_cos
    - day_progress_sin
    - toa_incident_solar_radiation
    - year_progress_cos
    - year_progress_sin

  # stacked_to_dataset(target_template) order, i.e. sorted(target_variables).
  target_data_var_order:
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
    - 2m_temperature
    - geopotential
    - mean_sea_level_pressure
    - specific_humidity
    - temperature
    - total_precipitation_6hr
    - u_component_of_wind
    - v_component_of_wind
    - vertical_velocity

  variable_dims:
    atmospheric_inputs: [batch, time, lat, lon, level]
    surface_inputs: [batch, time, lat, lon]
    forcing_inputs: [batch, time, lat, lon]
    static_inputs: [batch, lat, lon]
    atmospheric_targets: [batch, time, lat, lon, level]
    surface_targets: [batch, time, lat, lon]

channel_contract:
  atmospheric_input_channels: 156
  surface_input_channels: 8
  forcing_input_channels: 10
  static_input_channels: 2
  target_time_forcing_channels: 5
  model_input_channels: 181
  grid_node_geo_channels: 3
  grid_node_embed_input_channels: 184
  mesh_node_embed_input_channels: 184
  edge_feature_channels: 4
  model_output_channels: 83
