name: Official JAX project checks
on:
  push:
    branches: [zyx/sugon-graphcast]
  pull_request:
    branches: [zyx/sugon-graphcast]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r environment/requirements-ci.txt
      - run: ruff check . && ruff format --check .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -c 'from graphcast_bench.assets import verify_source; verify_source()'
      - run: python scripts/prepare_experiments.py --verify-only
